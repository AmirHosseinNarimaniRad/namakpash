<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>نمک‌پاش</title>
    <base href="/app/" />

    <meta name="description" content="نمک‌پاش: تقسیم خرج دورهمی، بدون حساب کاربری و بدون اینترنت." />
    <meta name="theme-color" content="#14B8A6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="نمک‌پاش" />

    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
    <!-- iOS reads this, not the manifest, when a page is added to the home screen, and it
         composites any transparency onto black - so this one is a full-bleed opaque square
         and iOS applies its own rounding. -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <div class="boot-mark"></div>
            <p class="boot-text">در حال آماده‌سازی…</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        مشکلی پیش آمد.
        <a href="." class="reload">بارگذاری دوباره</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        // Registered after boot so the precache never competes with the first paint. In
        // development this resolves to the no-op worker; publish swaps in the real one.
        navigator.serviceWorker?.register('service-worker.js');

        // Which ICU shard the runtime downloads depends on the device language, so the worker
        // cannot know which of the three published .dat files to keep — and on this very first
        // load the page is not controlled by it yet, so the request goes unseen. The page does
        // know: it just fetched one. Hand the url over, or the next launch without a network
        // dies on a missing .dat after everything else was cached correctly.
        navigator.serviceWorker?.ready.then(async registration => {
            for (let attempt = 0; attempt < 40; attempt++) {
                const icu = performance.getEntriesByType('resource')
                    .map(entry => entry.name)
                    .find(name => name.endsWith('.dat'));
                if (icu) {
                    registration.active?.postMessage({ type: 'cache', url: icu });
                    return;
                }
                await new Promise(resume => setTimeout(resume, 500));
            }
        });
    </script>
</body>

</html>
